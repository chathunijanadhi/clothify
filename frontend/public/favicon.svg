<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ef3c84"/>
    <stop offset="55%" stop-color="#f53f67"/>
    <stop offset="100%" stop-color="#ff6b1f"/>
  </linearGradient>
</defs>

<!-- Rounded-square gradient background -->
<rect x="0" y="0" width="512" height="512" rx="125" fill="url(#bg)"/>

<!-- White circular C -->
<path d="M370 174
         A156 156 0 1 0 370 338
         L337 305
         A110 110 0 1 1 337 207
         Z"
      fill="#fff"/>

<!-- Dark diagonal pin/stroke -->
<path d="M128 405 L403 107"
      fill="none" stroke="#101936" stroke-width="18"
      stroke-linecap="round" stroke-linejoin="round"/>

<!-- Ring at the end of the pin -->
<circle cx="404" cy="108" r="18" fill="none" stroke="#101936" stroke-width="12"/>
</svg>