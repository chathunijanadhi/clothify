name: Clothify CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".dockerignore"
      - ".env.example"
      - "docker-compose.yml"
      - "monitoring/**"
      - "README.md"
      - ".github/workflows/ci-cd.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".dockerignore"
      - ".env.example"
      - "docker-compose.yml"
      - "monitoring/**"
      - "README.md"
      - ".github/workflows/ci-cd.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clothify_ci
          POSTGRES_USER: clothify_ci
          POSTGRES_PASSWORD: clothify-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clothify_ci -d clothify_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: clothify_ci
      DB_PASSWORD: clothify-ci-only
      DB_DATABASE: clothify_ci
      JWT_SECRET: clothify-ci-dummy-secret
      LOG_LEVEL: silent
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npm run migrate

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit production dependencies
        working-directory: frontend
        # TEMPORARY ACCEPTED RISK: Firebase Firestore still pins vulnerable grpc-js; revisit by 2026-11-01.
        run: npm audit --omit=dev --audit-level=critical

  docker:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Compose configuration
        env:
          POSTGRES_DB: clothify_ci
          POSTGRES_USER: clothify_ci
          POSTGRES_PASSWORD: validation-only
          JWT_SECRET: validation-only
          GRAFANA_ADMIN_PASSWORD: validation-only
        run: docker compose --profile monitoring config --quiet

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$GITHUB_WORKSPACE/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$GITHUB_WORKSPACE/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml

      - name: Build backend image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: clothify-backend:scan
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: clothify-frontend:scan
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify runtime files and Nginx configuration
        run: |
          docker run --rm --entrypoint sh clothify-backend:scan -c "test -d /app/database/migrations && test -f /app/scripts/run-migrations.js"
          docker run --rm --entrypoint nginx clothify-frontend:scan -t

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clothify-backend:scan
          scan-type: image
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clothify-frontend:scan
          scan-type: image
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Save validated images for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          docker save clothify-backend:scan clothify-frontend:scan | gzip > clothify-images.tar.gz

      - name: Upload validated images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clothify-images
          path: clothify-images.tar.gz
          retention-days: 1

  publish:
    name: Publish validated images to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: none
      packages: write
    steps:
      - name: Download validated images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clothify-images

      - name: Load validated images
        run: |
          set -o pipefail
          gzip -dc clothify-images.tar.gz | docker load

      - name: Define image names
        id: image-names
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        env:
          IMAGE_NAME: ${{ steps.image-names.outputs.backend }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker tag clothify-backend:scan "$IMAGE_NAME:$IMAGE_SHA"
          docker tag clothify-backend:scan "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Push frontend image
        env:
          IMAGE_NAME: ${{ steps.image-names.outputs.frontend }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker tag clothify-frontend:scan "$IMAGE_NAME:$IMAGE_SHA"
          docker tag clothify-frontend:scan "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Deployment placeholder
        run: echo "::notice::Deployment is intentionally not configured yet."
